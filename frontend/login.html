<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Login | Swaraj Portfolio Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="login">
<header class="bar"><a class="brand" href="index.html">Swaraj Portfolio Hub</a><div class="right"><a class="btn" href="index.html">Back</a></div></header>
<main class="auth-page">
  <p class="muted sm">Welcome back</p>
  <h1>User Login</h1>
  <form id="auth-form" class="stack-form">
    <label>Username<input name="username" autocomplete="username" required></label>
    
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit" id="submit">Sign in</button>
  </form>
  <div class="status" id="status" aria-live="polite"></div>
  <p class="alt">No account? <a href="register.html">Register</a> &middot; <a href="index.html">Continue as guest</a></p>
</main>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
