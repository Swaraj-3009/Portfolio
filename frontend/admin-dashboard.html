<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community | Swaraj Portfolio Hub</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <header class="bar"><a class="brand" href="index.html">Swaraj Portfolio Hub</a><div class="right" id="bar-right"></div></header>
  <main class="wrap page">
    <p class="muted sm" id="role">Administrator</p>
    <h2 id="hello">Community</h2>
    <p class="muted">Manage relationship requests and memberships.</p>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="relationship-area" id="relationships"></div>
    <section class="panel admin-user-management" aria-labelledby="user-management-title">
      <div class="row"><div><h3 id="user-management-title">User accounts</h3><p class="muted">Remove a user account and its relationship and chat data.</p></div></div>
      <div id="admin-users" aria-live="polite"><p class="muted">Loading user accounts...</p></div>
    </section>
  </main>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/relationships.js"></script>
  <script src="js/admin-users.js"></script>
  <script>
    const currentAdmin = requireRole("admin");
    if (currentAdmin) {
      mountTopbar(currentAdmin);
      initRelationships(currentAdmin);
      initAdminUsers();
    }
  </script>
</body>
</html>
